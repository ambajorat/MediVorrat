name: MediVorrat
options:
  bundleIdPrefix: de.bajorat
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "GDYQYL67XG"
targets:
  MediVorrat:
    type: application
    platform: iOS
    sources:
      - path: MediVorrat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.bajorat.medivorrat
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: MediVorrat/Info.plist
      properties:
        CFBundleDisplayName: MediVorrat
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "MediVorrat nutzt die Kamera, um den Code auf Medikamentenpackungen zu lesen und neue Packungen in den Vorrat einzubuchen."
        NSHealthUpdateUsageDescription: "MediVorrat schreibt nichts in Apple Health. Die App liest nur deine freigegebenen Medikamente und Einnahmen, um den Vorrat zu berechnen."
        NSHealthShareUsageDescription: "MediVorrat liest deine Medikamente und die protokollierten Einnahmen aus Apple Health, um deinen Vorrat genau zu berechnen."
    entitlements:
      path: MediVorrat/MediVorrat.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
